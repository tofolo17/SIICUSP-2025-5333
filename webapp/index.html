<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Regression Explorer</title>
<meta name="description" content="Interactive tool to explore regression models: line, polynomial, B-spline and P-spline, in real time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="plot"></canvas>

  <header id="brand">
    <h1>Regression&nbsp;Explorer</h1>
    <p>line &middot; polynomial &middot; B&#8209;spline &middot; P&#8209;spline, in real time</p>
  </header>

  <div id="r2badge" hidden><span class="r2-light"></span><span class="r2-text"></span></div>

  <div id="toolbar">
    <button id="btn-help" class="tbtn" title="About and help">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.2 9.3a2.8 2.8 0 1 1 3.7 2.7c-.7.3-1 .8-1 1.6v.4"/><path d="M12 17.2h.01"/></svg>
      <span>Help</span></button>
    <button id="btn-fit" class="tbtn" title="Fit view to data">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <span>Fit</span></button>
    <button id="btn-grid" class="tbtn" title="Toggle grid">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
      <span>Grid</span></button>
    <button id="btn-csv" class="tbtn" title="Import CSV (x, y)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
      <span>CSV</span></button>
    <button id="btn-pdf" class="tbtn" title="Export report (PDF)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></svg>
      <span>PDF</span></button>
    <button id="btn-clear" class="tbtn" title="Clear all points">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
      <span>Clear</span></button>
    <button id="btn-panel" class="tbtn primary" title="Models and parameters">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M8 14v6"/></svg>
      <span>Models</span></button>
  </div>

  <div id="zoom">
    <button id="btn-zin" class="zbtn" title="Zoom in">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg>
    </button>
    <button id="btn-zout" class="zbtn" title="Zoom out">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/></svg>
    </button>
  </div>

  <div id="legend" hidden></div>

  <p id="hint">Tap to add a point &middot; drag to move &middot; drag the background to pan &middot; pinch or scroll to zoom &middot; double&#8209;tap a point to remove</p>

  <aside id="panel"></aside>

  <input id="file-csv" type="file" accept=".csv,text/csv,text/plain" hidden>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/linalg.js"></script>
  <script src="js/models.js"></script>
  <script src="js/plot.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
