name: Deploy webapp to GitHub Pages

# Publica a pasta webapp/ numa branch gh-pages (sem usar o serviço de artefato
# do Pages, que estava falhando). Depois, em Settings > Pages, escolha
# "Deploy from a branch" -> gh-pages -> / (root).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./webapp
          publish_branch: gh-pages
